# Minimal CI added on the throwaway branch try/service-launch (commit-live service trial).
name: CI

on:
  push:
    branches: [main, 'try/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: npm ci --no-audit --no-fund
      - name: build (smoke)
        run: npm run build
